services:
  db:
    image: postgres:16-alpine
    container_name: ai_sales_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-ai_sales_saas}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ai_sales_saas"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.api
    container_name: ai_sales_api
    restart: always
    environment:
      - ENVIRONMENT=development
      - SECRET_KEY=${SECRET_KEY:-super_secret_key_32bytes_minimum_length_change_in_prod}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-gAAAAABl8-9_SampleFernetKey32BytesForEncryption123=}
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-ai_sales_saas}
      - SYNC_DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-ai_sales_saas}
      - AI_PROVIDER=${AI_PROVIDER:-groq}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - BOT_TOKEN=${BOT_TOKEN}
      - DEFAULT_AI_MODEL=${DEFAULT_AI_MODEL:-llama-3.3-70b-versatile}
      - TELEGRAM_WEBHOOK_DOMAIN=${TELEGRAM_WEBHOOK_DOMAIN:-http://localhost:8000}
    ports:
      - "8001:8000"
    depends_on:
      db:
        condition: service_healthy

  bot:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.bot
    container_name: ai_sales_bot
    restart: always
    environment:
      - API_BASE_URL=http://api:8000/api/v1
      - BOT_TOKEN=${BOT_TOKEN}
    depends_on:
      - api

  web:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.web
    container_name: ai_sales_web
    restart: always
    environment:
      - NEXT_PUBLIC_API_BASE=http://localhost:8001/api/v1
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  postgres_data: